[project]
name = "dlplusplus"
version = "0.1.0"
description = "DL++ — Feature processing and data loading for child-centered long-form audio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.19.0",
    "matplotlib>=3.10.6",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "polars>=1.0",
    "pyarrow>=23.0.1",
    "brouhaha",
    "segma",
    "soundfile>=0.13",
    "ten-vad>=1.0.6.8",
    "panns-inference>=0.1.1",
    "webdataset>=1.0.2",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
make-manifest = "audio_pipeline.make_manifest:main"
download-models = "audio_pipeline.download_models:main"

[build-system]
requires = ["uv_build>=0.5.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["audio_pipeline", "dataloader"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "-rA", "--durations=10"]

[tool.uv.sources]
brouhaha = { git = "https://github.com/marianne-m/brouhaha-vad", rev = "1e175a9dee0f4d7c618653d64796a45405a768e1" }
segma = { git = "https://github.com/arxaqapi/segma", rev = "9c398231011a7b16b76cf7be8e99c8b4dbc7ac35" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "huggingface-hub>=0.35.0",
    "pygithub>=2.9.1",
    "ipython>=9.13.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchcodec==0.9.*",
    "numpy>=2.0",
    "pyannote-audio>=3.4,<4",
]
